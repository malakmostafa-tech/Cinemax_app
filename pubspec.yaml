name: cinemax_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  flutter_bloc: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
   

    
flutter_native_splash:
  color: "#1F1D2B"
  image: "assets/images/splash_screen_logo.png"
  fullscreen: true

  android_12:
    color: "#1F1D2B"
    image: "assets/images/splash_screen_logo.png"
    icon_background_color: "#111111"